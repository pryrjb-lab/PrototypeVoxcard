<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxCard | The Smart Digital Business Card</title>

    <meta property="og:title" content="VoxCard - The Smart Digital Business Card">
    <meta property="og:description" content="Stop handing out cards people throw away. One link holds your contact info, socials, and booking page.">
    <meta property="og:image" content="https://voxcard.voxlumedia.com/assets/og-image.jpg">
    <meta property="og:url" content="https://voxcard.voxlumedia.com">
    <meta property="og:type" content="website">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ===== VoxCard Dark Gold — semua style di-scope ke .vox-root (aman untuk WordPress) ===== */
        .vox-root {
            --gold: #d4af37;
            --gold-light: #e8c766;
            --gold-grad: linear-gradient(180deg, #e2c25a 0%, #c9a236 100%);
            --gold-border: rgba(212, 175, 55, 0.35);
            --bg: #0a0a0c;
            --surface: #141416;
            --border: rgba(255, 255, 255, 0.06);
            --text-white: #f5f5f5;
            --text-body: #9ca3af;
            --text-muted: #6b7280;
            --font: 'Inter', system-ui, -apple-system, sans-serif;
            --radius: 14px;

            background: var(--bg); color: var(--text-body); font-family: var(--font);
            line-height: 1.6; overflow-x: hidden; width: 100%; -webkit-font-smoothing: antialiased;
        }
        .vox-root *, .vox-root *::before, .vox-root *::after { margin: 0; padding: 0; box-sizing: border-box; }
        .vox-root a { text-decoration: none; color: inherit; }
        .vox-root img { max-width: 100%; display: block; }
        .vox-root h1, .vox-root h2, .vox-root h3, .vox-root h4 { font-family: var(--font); color: var(--text-white); line-height: 1.15; letter-spacing: -0.02em; font-weight: 700; }

        /* WordPress Conflict Fixes */
        .vox-root .vox-container { width: 100% !important; max-width: 880px !important; margin: 0 auto !important; padding: 0 20px !important; box-sizing: border-box !important; }
        .vox-root .vox-section { display: block !important; padding: 90px 0 !important; width: 100% !important; clear: both !important; }
        .vox-root .section-header { display: block !important; text-align: center !important; margin-bottom: 50px !important; width: 100% !important; }
        .vox-root .section-header h2 { font-size: clamp(1.6rem, 3.4vw, 2rem); }
        .vox-root .eyebrow { display: block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); margin-bottom: 14px; }
        .vox-root .vox-divider { height: 1px; max-width: 480px; margin: 0 auto; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent); }

        /* Buttons */
        .vox-root .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: var(--gold-grad); color: #1a1405; font-family: var(--font); font-weight: 700;
            padding: 13px 22px; border-radius: 8px; font-size: 0.85rem; border: 1px solid #e8c766;
            cursor: pointer; text-align: center; white-space: nowrap;
            box-shadow: 0 6px 20px -6px rgba(212, 175, 55, 0.45);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .vox-root .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 26px -6px rgba(212, 175, 55, 0.6); }
        .vox-root .btn-sm { padding: 8px 16px; font-size: 0.75rem; border-radius: 6px; }
        .vox-root .btn-free {
            display: block; width: 100%; text-align: center; background: transparent; color: var(--text-white);
            font-weight: 700; font-family: var(--font); font-size: 0.85rem; padding: 12px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.18); transition: border-color 0.2s, background 0.2s;
        }
        .vox-root .btn-free:hover { border-color: var(--gold); background: rgba(212,175,55,0.06); }

        /* Navbar */
        .vox-root .vox-nav { position: sticky; top: 0; z-index: 50; background: rgba(10,10,12,0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid transparent; transition: border-color 0.3s; }
        .vox-root .vox-nav.scrolled { border-color: var(--border); }
        .vox-root .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; }
        .vox-root .vox-logo { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--text-white); font-size: 1.05rem; }
        .vox-root .logo-mark { object-fit: cover; width: 26px; height: 26px; border-radius: 6px; background: linear-gradient(135deg, #3a3320, #1a1610); border: 1px solid var(--gold-border); display: flex; align-items: center; justify-content: center; color: var(--gold); font-weight: 900; font-size: 0.85rem; }
        .vox-root .nav-links { display: flex; align-items: center; gap: 24px; }
        .vox-root .nav-links a:not(.btn) { font-size: 0.78rem; font-weight: 500; color: var(--text-body); transition: color 0.2s; }
        .vox-root .nav-links a:not(.btn):hover { color: var(--text-white); }
        .vox-root .nav-burger { display: none; background: none; border: 0; cursor: pointer; color: var(--text-white); font-size: 1.2rem; width: 36px; height: 36px; }

        /* 1. Hero */
        .vox-root .hero { padding: 70px 0 60px !important; position: relative; }
        .vox-root .hero-content { display: grid; grid-template-columns: 1.05fr 1fr; gap: 30px; align-items: center; }
        .vox-root .hero-badge { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--gold-border); background: rgba(212,175,55,0.07); color: var(--gold); font-size: 0.62rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 18px; }
        .vox-root .hero-badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); }
        .vox-root .hero-text h1 { font-size: clamp(2.2rem, 5vw, 2.75rem); margin-bottom: 24px; }
        .vox-root .gold-text { color: var(--gold); }
        .vox-root .hero-text p { font-size: 0.98rem; max-width: 360px; margin-bottom: 34px; }
        .vox-root .hero-cta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .vox-root .hero-note { font-size: 0.68rem; color: var(--text-muted); }
        .vox-root .hero-visual { display: flex; justify-content: center; position: relative; }
        .vox-root .hero-visual::before { content: ""; position: absolute; inset: 15% 10%; background: radial-gradient(circle, rgba(212,175,55,0.12), transparent 65%); filter: blur(30px); }
        .vox-root .hero-visual img { position: relative; width: 100%; max-width: 300px; animation: voxFloat 5s ease-in-out infinite; mix-blend-mode: lighten; filter: drop-shadow(0 25px 35px rgba(0,0,0,0.6)); }
        @keyframes voxFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

        /* 2. How it works (bento) */
        .vox-root .bento-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .vox-root .bento-card, .vox-root .feat-pill, .vox-root .t-card, .vox-root .price-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            transition: border-color 0.3s, transform 0.3s;
        }
        .vox-root .bento-card:hover, .vox-root .feat-pill:hover, .vox-root .t-card:hover { border-color: var(--gold-border); transform: translateY(-4px); }
        .vox-root .bento-card { padding: 24px 22px 30px; }
        .vox-root .bento-icon { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 34px; border-radius: 7px; background: rgba(212,175,55,0.1); border: 1px solid var(--gold-border); color: var(--gold); font-weight: 700; font-size: 0.95rem; margin-bottom: 26px; }
        .vox-root .bento-card h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 10px; }
        .vox-root .bento-card p { font-size: 0.78rem; color: var(--text-muted); line-height: 1.65; }

        /* 3. Features + phone mockup */
        .vox-root .features-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: start; }
        .vox-root .features-intro h2 { font-size: clamp(1.6rem, 3.4vw, 2rem); margin-bottom: 22px; }
        .vox-root .features-intro p { font-size: 0.85rem; color: var(--text-muted); max-width: 350px; }
        .vox-root .feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .vox-root .feat-pill { padding: 20px 18px; min-height: 76px; font-size: 0.74rem; color: #d1d5db; font-weight: 500; }
        .vox-root .feat-pill i { display: block; color: var(--gold); font-size: 0.9rem; margin-bottom: 12px; }

        .vox-root .phone-wrapper { display: flex; justify-content: center; margin-top: 60px; }
        .vox-root .phone { width: 150px; height: 300px; border-radius: 24px; padding: 4px; background: linear-gradient(145deg, #e8c766, #6b5317 40%, #e8c766 70%, #8a6c20); box-shadow: 0 25px 50px -10px rgba(0,0,0,0.8), 0 0 30px rgba(212,175,55,0.15); transition: transform 0.4s; }
        .vox-root .phone-img { width: 180px; height: auto; border-radius: 12px; box-shadow: 0 25px 50px -10px rgba(0,0,0,0.8), 0 0 30px rgba(212,175,55,0.15); transition: transform 0.4s; }
        .vox-root .phone-wrapper:hover .phone-img { transform: translateY(-6px) rotate(-1deg); }
        .vox-root .phone-wrapper:hover .phone { transform: translateY(-6px) rotate(-1deg); }
        .vox-root .phone-screen { position: relative; width: 100%; height: 100%; border-radius: 20px; overflow: hidden; padding: 22px 10px 10px; display: flex; flex-direction: column; align-items: center;
            background: radial-gradient(ellipse at 80% 10%, #3a2c0c 0%, transparent 45%), radial-gradient(ellipse at 10% 90%, #3a2c0c 0%, transparent 45%), #0b0907; }
        .vox-root .phone-screen::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(160deg, transparent 30%, rgba(212,175,55,0.18) 33%, transparent 36%), linear-gradient(200deg, transparent 70%, rgba(212,175,55,0.25) 73%, transparent 76%); }
        .vox-root .dynamic-island { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 40px; height: 10px; border-radius: 10px; background: #000; z-index: 2; }
        .vox-root .phone-brand { position: absolute; top: 22px; left: 10px; font-size: 0.38rem; color: #d1d5db; letter-spacing: 0.05em; }
        .vox-root .v-app-icon { margin-top: 22px; width: 56px; height: 46px; }
        .vox-root .p-name { font-size: 0.62rem; font-weight: 600; letter-spacing: 0.12em; color: var(--gold-light); margin: 4px 0 10px; }
        .vox-root .links-container { width: 100%; position: relative; }
        .vox-root .link-btn { display: flex; align-items: center; gap: 6px; width: 100%; padding: 3px 6px; margin-bottom: 5px; border-radius: 999px; border: 1px solid rgba(232,199,102,0.75); background: rgba(0,0,0,0.5); font-size: 0.36rem; color: #e5e7eb; transition: background 0.2s; }
        .vox-root .link-btn:hover { background: rgba(212,175,55,0.2); }
        .vox-root .link-btn i:first-child { width: 11px; height: 11px; border-radius: 50%; background: #1a1a1a; border: 1px solid rgba(232,199,102,0.5); display: flex; align-items: center; justify-content: center; font-size: 0.3rem; color: #fff; }
        .vox-root .link-btn .fa-chevron-right { margin-left: auto; font-size: 0.3rem; color: #9ca3af; }
        .vox-root .phone-url { position: relative; margin-top: auto; font-size: 0.3rem; color: #9ca3af; padding-top: 4px; border-top: 1px solid rgba(255,255,255,0.15); width: 100%; text-align: center; }

        /* 4. Testimonials */
        .vox-root .testimonial-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .vox-root .t-card { padding: 26px 22px; }
        .vox-root .t-stars { color: var(--gold); font-size: 0.6rem; letter-spacing: 3px; margin-bottom: 16px; }
        .vox-root .t-card p { font-size: 0.76rem; color: #a1a1aa; line-height: 1.7; margin-bottom: 22px; }
        .vox-root .t-user { display: flex; align-items: center; gap: 10px; }
        .vox-root .t-avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg,#2a2a2e,#3a3a40); border: 1px solid var(--gold-border); color: var(--gold); font-size: 0.55rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .vox-root .t-user img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; background: #2a2a2e; border: 1px solid var(--border); }
        .vox-root .t-user h4 { font-size: 0.68rem; font-weight: 600; color: #d4d4d8; letter-spacing: 0; }
        .vox-root .t-user span { display: block; font-size: 0.64rem; color: var(--text-muted); line-height: 1.2; }

        /* 5. Pricing */
        .vox-root .pricing-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 560px; margin: 0 auto; }
        .vox-root .price-card { position: relative; padding: 28px 22px 26px; display: flex; flex-direction: column; }
        .vox-root .price-card.premium { border-color: var(--gold-border); background: linear-gradient(180deg, #1a1710 0%, var(--surface) 60%); }
        .vox-root .launch-badge { position: absolute; top: -1px; left: 50%; transform: translateX(-50%); background: var(--gold-grad); color: #1a1405; font-size: 0.56rem; font-weight: 800; letter-spacing: 0.1em; padding: 2px 12px; border-radius: 0 0 6px 6px; }
        .vox-root .price-card h3 { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.12em; color: #d4d4d8; }
        .vox-root .price-card.premium h3 { color: var(--gold); }
        .vox-root .price { font-size: 1.9rem; font-weight: 700; color: var(--text-white); margin: 16px 0 14px; line-height: 1; }
        .vox-root .price span { font-size: 0.66rem; font-weight: 400; color: var(--text-muted); margin-left: 2px; }
        .vox-root .price-desc { font-size: 0.7rem; min-height: 36px; margin-bottom: 22px; }
        .vox-root .price-card ul { list-style: none; margin-bottom: 28px; flex: 1; }
        .vox-root .price-card li { display: flex; align-items: center; gap: 8px; font-size: 0.72rem; color: #a1a1aa; margin-bottom: 8px; }
        .vox-root .price-card li i { color: var(--gold); font-size: 0.62rem; }

        /* 6. FAQ */
        .vox-root .faq-wrapper { max-width: 490px; margin: 0 auto; }
        .vox-root .faq-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
        .vox-root details { border-bottom: 1px solid var(--border); }
        .vox-root details:last-child { border-bottom: 0; }
        .vox-root summary { padding: 20px 18px; font-size: 0.8rem; font-weight: 600; color: var(--text-white); cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; transition: background 0.2s; }
        .vox-root summary:hover { background: rgba(255,255,255,0.02); }
        .vox-root summary::-webkit-details-marker { display: none; }
        .vox-root summary::after { content: "+"; color: var(--gold); font-size: 1rem; font-weight: 400; transition: transform 0.3s; }
        .vox-root details[open] summary::after { transform: rotate(45deg); }
        .vox-root details p { padding: 0 18px 20px; margin-top: -10px; font-size: 0.68rem; color: var(--text-muted); line-height: 1.7; animation: voxSlide 0.3s ease-out; }
        @keyframes voxSlide { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

        /* 7. Footer CTA */
        .vox-root .footer-cta { padding: 20px 0 0; }
        .vox-root .cta-box { max-width: 490px; margin: 0 auto; padding: 60px 30px; text-align: center; border-radius: var(--radius); border: 1px solid var(--border);
            background: radial-gradient(ellipse at 50% 0%, rgba(212,175,55,0.12), transparent 65%), linear-gradient(180deg, #1a1710, #121214); }
        .vox-root .cta-box h2 { font-size: clamp(1.4rem, 3vw, 1.6rem); margin-bottom: 12px; }
        .vox-root .cta-box p { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 28px; }
        .vox-root .footer-bar { border-top: 1px solid var(--border); padding: 28px 0 36px; margin-top: 80px; }
        .vox-root .footer-inner { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
        .vox-root .footer-bar .vox-logo { font-size: 0.85rem; }
        .vox-root .footer-bar .logo-mark { width: 20px; height: 20px; font-size: 0.65rem; }
        .vox-root .footer-bar small { font-size: 0.68rem; color: #4b5563; }

        /* Scroll reveal */
        .vox-root .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.7s ease, transform 0.7s ease; }
        .vox-root .reveal.in { opacity: 1; transform: none; }

        .vox-root .ic { display: block; width: 1em; height: 1em; }
        .vox-root .feat-pill .ic { width: 16px; height: 16px; color: var(--gold); margin-bottom: 12px; }
        .vox-root .price-card li .ic { width: 11px; height: 11px; color: var(--gold); flex-shrink: 0; }
        .vox-root .t-stars { display: flex; gap: 4px; }
        .vox-root .t-stars .ic { width: 10px; height: 10px; }
        .vox-root .nav-burger { position: relative; border: 1px solid var(--gold-border) !important; border-radius: 8px; background: rgba(212,175,55,0.06) !important; }
        .vox-root .nav-burger .bar { position: absolute; left: 9px; width: 16px; height: 2px; border-radius: 2px; background: var(--gold); transition: transform 0.3s, opacity 0.2s, top 0.3s; }
        .vox-root .nav-burger .bar:nth-child(1) { top: 11px; }
        .vox-root .nav-burger .bar:nth-child(2) { top: 16px; }
        .vox-root .nav-burger .bar:nth-child(3) { top: 21px; }
        .vox-root .vox-nav.open .nav-burger .bar:nth-child(1) { top: 16px; transform: rotate(45deg); }
        .vox-root .vox-nav.open .nav-burger .bar:nth-child(2) { opacity: 0; }
        .vox-root .vox-nav.open .nav-burger .bar:nth-child(3) { top: 16px; transform: rotate(-45deg); }
        /* Responsive */
        @media (max-width: 860px) {
            .vox-root .features-layout { grid-template-columns: 1fr; }
            .vox-root .bento-grid, .vox-root .testimonial-grid { grid-template-columns: 1fr; max-width: 460px; margin: 0 auto; }
        }
        @media (max-width: 720px) {
            .vox-root .nav-links { position: absolute; top: 64px; left: 0; right: 0; flex-direction: column; gap: 0; background: #0d0d10; border-bottom: 1px solid var(--border); max-height: 0; overflow: hidden; transition: max-height 0.35s; }
            .vox-root .vox-nav.open .nav-links { max-height: 320px; }
            .vox-root .nav-links a:not(.btn) { padding: 14px 20px; width: 100%; font-size: 0.9rem; }
            .vox-root .nav-links .btn { margin: 10px 20px 18px; }
            .vox-root .nav-burger { display: block; }
            .vox-root .hero { padding: 40px 0 !important; }
            .vox-root .hero-content { grid-template-columns: 1fr; }
            .vox-root .hero-visual { order: -1; }
            .vox-root .hero-visual img { max-width: 230px; }
            .vox-root .vox-section { padding: 64px 0 !important; }
        }
        @media (max-width: 520px) {
            .vox-root .pricing-grid { grid-template-columns: 1fr; max-width: 340px; }
            .vox-root .cta-box { padding: 44px 20px; }
            .vox-root .footer-inner { justify-content: center; text-align: center; }
        }
